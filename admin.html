// My Timetable moved to https://my-timetable-511022.web.app (needed for Google sign-in on phones).
// Remove the old offline copy of the app from this address, then go to the new one.
(async function(){
  try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(e){}
  try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
  location.replace("https://my-timetable-511022.web.app/admin.html");
})();
</script>
