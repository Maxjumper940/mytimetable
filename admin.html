<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>My Timetable · Admin</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1f;--muted:#6b6b70;--line:#e2e0da;--accent:#0b6e4f;--surface:#fff;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--fg:#eee;--muted:#a0a0a5;--line:#2c2c2e;--surface:#1d1d1f;--accent:#4fc39a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
input,select{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{font:inherit;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.small{padding:4px 9px;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;letter-spacing:.04em}
.muted{color:var(--muted)}.bad{color:var(--bad)}.ok{color:var(--accent);font-weight:600}
.stats{display:flex;gap:18px;flex-wrap:wrap}.stats b{display:block;font-size:1.5rem}
.scroll{overflow-x:auto}#fresh code{display:block;padding:2px 0}
</style></head><body><main>
<div class="row" style="justify-content:space-between"><h1>My Timetable · Admin</h1><span id="who" class="muted"></span></div>
<div id="gate" class="card"><p id="gateMsg">Loading…</p><button class="primary" id="signin" hidden>Sign in with Google</button> <button id="signout" hidden>Sign out</button></div>
<div id="app" hidden>
  <div class="card stats" id="stats"></div>
  <div class="card"><h2>Make access codes</h2>
    <div class="row">
      <label>How many<input type="number" id="n" value="1" min="1" max="50" style="width:90px"></label>
      <label>Days each<input type="number" id="days" value="30" min="1" max="366" style="width:100px"></label>
      <label>Note (who it's for, payment ref)<input id="note" style="width:260px" maxlength="120"></label>
      <label>Must be used within (days, optional)<input type="number" id="exp" min="1" max="365" placeholder="never" style="width:120px"></label>
      <button class="primary" id="make">Make codes</button>
    </div>
    <div id="fresh" class="muted" style="margin-top:10px"></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Codes</h2>
    <label>Show<select id="filter"><option value="all">All</option><option value="unused">Unused</option><option value="used">Used</option></select></label></div>
    <div class="scroll"><table><thead><tr><th>Code</th><th>Days</th><th>Note</th><th>Made</th><th>Status</th><th></th></tr></thead><tbody id="codes"></tbody></table></div></div>
  <div class="card"><h2>Users</h2>
    <div class="scroll"><table><thead><tr><th>Email</th><th>Premium until</th><th>Last code</th><th></th></tr></thead><tbody id="users"></tbody></table></div></div>
</div>
</main>
<script src="firebase-config.js"></script>
<script src="admin.bundle.js"></script>
</body></html>
